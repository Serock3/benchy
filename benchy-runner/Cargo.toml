[package]
name = "benchy-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
benchy-lib = { path = "../benchy-lib" }
chrono = { version = "0.4.40", features = ["serde"] }
fs2 = "0.4"
# Pinned: the JSON report format this crate parses may change between releases.
hotpath = { version = "=0.30.1", optional = true, default-features = false, features = ["json"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["fs", "process", "io-util", "sync", "time", "rt"] }

[features]
default = []
hotpath = ["dep:hotpath"]

[dev-dependencies]
tokio = { version = "1.44.2", features = ["rt", "macros"] }
