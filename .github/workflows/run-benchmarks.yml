name: Run benchmarks

on:
  workflow_call:
    inputs:
      benchmarks:
        description: Comma or space-delimited benchmark IDs, or "default"/"all"
        required: false
        default: default
        type: string
      manifest-path:
        description: Path to the repository-local benchmark workspace manifest
        required: false
        default: benchmarks/Cargo.toml
        type: string
      runner-labels:
        description: JSON array of labels identifying the benchmark controller
        required: false
        default: '["self-hosted", "Linux", "benchy"]'
        type: string
      bencher-project:
        description: Bencher project slug; empty disables publication
        required: false
        default: ''
        type: string
      bencher-testbed:
        description: Stable identifier for the benchmark hardware and configuration
        required: false
        default: alice-bob-v1
        type: string
    secrets:
      BENCHER_API_KEY:
        description: API key for the selected Bencher project, used only by the publisher
        required: false

permissions: {}

jobs:
  benchmark:
    name: Run ${{ inputs.benchmarks }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.results.outputs.artifact-id }}
      framework-sha: ${{ steps.framework.outputs.sha }}
      run-attempt: ${{ steps.framework.outputs.run-attempt }}
    env:
      BENCHY_RESULT_DIR: benchmark-results/${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout benchmark definitions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: source
      - name: Checkout Benchy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Serock3/benchy
          path: benchy
      - name: Record framework revision
        id: framework
        shell: bash
        run: |
          echo "sha=$(git -C benchy rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          rust-src-dir: source
          cache: false
      - name: Build benchmark controller
        working-directory: benchy
        run: cargo build --locked --release --package benchy-cli
      - name: Run benchmarks
        working-directory: source
        env:
          BENCHY_PEER: ${{ vars.BENCHY_PEER }}
          BENCHY_ALICE_ADDRESS: ${{ vars.BENCHY_ALICE_ADDRESS }}
          BENCHY_BOB_ADDRESS: ${{ vars.BENCHY_BOB_ADDRESS }}
        run: >-
          ../benchy/target/release/benchy-cli run
          --manifest-path "${{ inputs.manifest-path }}"
          --benchmarks "${{ inputs.benchmarks }}"
          --result-dir "../$BENCHY_RESULT_DIR"
      - name: Show raw benchmark results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          results=("$BENCHY_RESULT_DIR"/*.json)
          {
            echo '## Raw benchmark results'
            if (( ${#results[@]} == 0 )); then
              echo
              echo '_No result files were produced._'
            else
              for result in "${results[@]}"; do
                echo
                printf '### `%s`\n\n' "$(basename "$result")"
                echo '```json'
                cat "$result"
                echo
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        id: results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCHY_RESULT_DIR }}
          if-no-files-found: warn

  publish:
    name: Publish results to Bencher
    needs: benchmark
    if: ${{ inputs.bencher-project != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check result artifact
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.benchmark.outputs.artifact-id }}
        run: test -n "$ARTIFACT_ID"
      - name: Checkout matching Benchy revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Serock3/benchy
          ref: ${{ needs.benchmark.outputs.framework-sha }}
          path: benchy
          persist-credentials: false
      - name: Download benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.benchmark.outputs.artifact-id }}
          path: raw-results
          merge-multiple: true
      - name: Verify tested revision
        shell: bash
        env:
          BENCHMARK_ATTEMPT: ${{ needs.benchmark.outputs.run-attempt }}
        run: |
          jq -s -e --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$BENCHMARK_ATTEMPT" \
            'length > 0 and all(.[]; .commit == $commit and .branch == $branch
              and .run_id == $run and .environment.GITHUB_RUN_ATTEMPT == $attempt)' \
            raw-results/*.json > /dev/null
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          toolchain: stable
          cache: false
      - name: Convert results to Bencher Metric Format
        shell: bash
        run: |
          mkdir -p bencher-results
          cargo run --locked --manifest-path benchy/Cargo.toml --package benchy-cli -- \
            export-bencher --result-dir raw-results --output bencher-results/metrics.json
      - name: Install Bencher CLI
        uses: bencherdev/bencher@413bcf965d6bbda1592f2197bde016db55348746
      - name: Publish results
        shell: bash
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ inputs.bencher-project }}
          BENCHER_TESTBED: ${{ inputs.bencher-testbed }}
        run: bash benchy/scripts/publish-bencher.sh bencher-results/metrics.json bencher-results/report.json
      - name: Upload Bencher diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bencher-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: bencher-results/
          if-no-files-found: ignore
