name: Run benchmarks

on:
  workflow_call:
    inputs:
      benchmarks:
        description: Comma or space-delimited benchmark IDs, or "default"/"all"
        required: false
        default: default
        type: string
      manifest-path:
        description: Path to the repository-local benchmark workspace manifest
        required: false
        default: benchmarks/Cargo.toml
        type: string
      framework-ref:
        description: Benchy revision to build; pin alongside this workflow for reproducible runs
        required: false
        default: main
        type: string
      iterations:
        description: Complete runs per benchmark, from 1 to 100
        required: false
        default: 1
        type: number
      runner-labels:
        description: JSON array of labels identifying the benchmark controller
        required: false
        default: '["self-hosted", "Linux", "benchy"]'
        type: string

permissions: {}

jobs:
  benchmark:
    name: Run ${{ inputs.benchmarks }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 120
    env:
      BENCHY_RESULT_DIR: benchmark-results/${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout benchmark definitions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout Benchy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Serock3/benchy
          ref: ${{ inputs.framework-ref }}
          path: benchy
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
        with:
          rust-src-dir: source
          cache: false
      - name: Build benchmark controller
        working-directory: benchy
        run: cargo build --locked --release --package benchy-cli
      - name: Run benchmarks
        working-directory: source
        env:
          BENCHY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCHY_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || github.ref_name }}
          BENCHY_PEER: ${{ vars.BENCHY_PEER }}
          BENCHY_ALICE_ADDRESS: ${{ vars.BENCHY_ALICE_ADDRESS }}
          BENCHY_BOB_ADDRESS: ${{ vars.BENCHY_BOB_ADDRESS }}
          BENCHY_MANIFEST: ${{ inputs.manifest-path }}
          BENCHY_SELECTION: ${{ inputs.benchmarks }}
          BENCHY_ITERATIONS: ${{ inputs.iterations }}
        run: >-
          ../benchy/target/release/benchy-cli run
          --manifest-path "$BENCHY_MANIFEST"
          --benchmarks "$BENCHY_SELECTION"
          --result-dir "../$BENCHY_RESULT_DIR"
          --iterations "$BENCHY_ITERATIONS"
      - name: Show raw benchmark results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          results=()
          if [[ -d "$BENCHY_RESULT_DIR" ]]; then
            while IFS= read -r -d '' result; do
              results+=("$result")
            done < <(find "$BENCHY_RESULT_DIR" -maxdepth 2 -type f -name '*.json' -print0 | sort -z)
          fi
          {
            echo '## Raw benchmark results'
            if (( ${#results[@]} == 0 )); then
              echo
              echo '_No result files were produced._'
            else
              for result in "${results[@]}"; do
                echo
                printf '### `%s`\n\n' "${result#"$BENCHY_RESULT_DIR"/}"
                echo '```json'
                cat "$result"
                echo
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCHY_RESULT_DIR }}
          if-no-files-found: warn
